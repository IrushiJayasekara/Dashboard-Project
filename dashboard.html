<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>


    <!-- Your separate CSS file -->
    <link rel="stylesheet"
          href="style.css?v=14">


    <!-- Axpert CSS -->
    <link type="text/css"
          rel="stylesheet"
          href="../../adamuat/HTMLPages/Css/style.css_1787634779764.css?v=1787641334705">

</head>


<body>


    <div class="dashboard">


        <!-- =====================================================
             TOP KPI CARDS
             ===================================================== -->

        <div class="kpi-container">


            <!-- =================================================
                 TOTAL M/C QTY
                 Data Source:
                 Total M/C Quantity
                 ================================================= -->

            <div class="kpi-card"
                 data-kpi="total-mc-quantity">

                <div class="kpi-icon kpi-icon-green">
                    <span>▣</span>
                </div>

                <div class="kpi-content">

                    <div class="kpi-title">
                        Total M/C Qty
                    </div>

                    <div class="kpi-value"
                         data-value="Total M/C Quantity">
                        0
                    </div>

                </div>

            </div>



            <!-- =================================================
                 TEA QTY
                 Data Source:
                 TEA QTY
                 ================================================= -->

            <div class="kpi-card"
                 data-kpi="tea-qty">

                <div class="kpi-icon kpi-icon-orange">
                    <span>♢</span>
                </div>

                <div class="kpi-content">

                    <div class="kpi-title">
                        Tea Qty (kg)
                    </div>

                    <div class="kpi-value"
                         data-value="TEA QTY">
                        0
                    </div>

                </div>

            </div>



            <!-- =================================================
                 SALES VALUE USD
                 Data Source:
                 Revenue
                 ================================================= -->

            <div class="kpi-card"
                 data-kpi="sales-usd">

                <div class="kpi-icon kpi-icon-green">
                    <span>$</span>
                </div>

                <div class="kpi-content">

                    <div class="kpi-title">
                        Sales Value(USD)
                    </div>

                    <div class="kpi-value"
                         data-value="Revenue">
                        0
                    </div>

                </div>

            </div>



            <!-- =================================================
                 SALES VALUE LKR
                 Data Source:
                 Revenue × EXRATE
                 ================================================= -->

            <div class="kpi-card"
                 data-kpi="sales-lkr">

                <div class="kpi-icon kpi-icon-purple">
                    <span>▣</span>
                </div>

                <div class="kpi-content">

                    <div class="kpi-title">
                        Sales Value(LKR)
                    </div>

                    <div class="kpi-value"
                         data-value="RevenueLKR">
                        0
                    </div>

                </div>

            </div>



            <!-- =================================================
                 TOTAL COST
                 Data Source:
                 Total Cost
                 ================================================= -->

            <div class="kpi-card"
                 data-kpi="total-cost">

                <div class="kpi-icon kpi-icon-blue">
                    <span>▤</span>
                </div>

                <div class="kpi-content">

                    <div class="kpi-title-row">

                        <div class="kpi-title">
                            Total Cost
                        </div>

                        <div class="kpi-currency">

                            LKR

                            <span class="dropdown-arrow">
                                ⌄
                            </span>

                        </div>

                    </div>


                    <div class="kpi-value"
                         data-value="Total Cost">
                        0
                    </div>

                </div>

            </div>



            <!-- =================================================
                 TOTAL PROFIT / LOSS
                 Data Source:
                 Total CONTRIBUTION
                 ================================================= -->

            <div class="kpi-card"
                 data-kpi="total-profit">

                <div class="kpi-icon kpi-icon-orange">
                    <span>▥</span>
                </div>

                <div class="kpi-content">

                    <div class="kpi-title-row">

                        <div class="kpi-title">
                            Total Profit/Loss
                        </div>

                        <div class="kpi-currency">

                            LKR

                            <span class="dropdown-arrow">
                                ⌄
                            </span>

                        </div>

                    </div>


                    <div class="kpi-value"
                         data-value="Total CONTRIBUTION">
                        0
                    </div>

                </div>

            </div>



            <!-- =================================================
                 SCAS REPORT
                 ================================================= -->

            <div class="kpi-card">

                <div class="kpi-icon kpi-icon-green">
                    <span>▥</span>
                </div>

                <div class="kpi-content">

                    <div class="kpi-title">
                        SCAS Report
                    </div>

                    <div class="kpi-value">
                        Open
                    </div>

                </div>

            </div>


        </div>



        <!-- =====================================================
             FUTURE DASHBOARD CONTENT
             ===================================================== -->

        <div class="dashboard-content">

            <!--
                Add other dashboard sections here.
            -->

        </div>


    </div>



    <!-- =========================================================
         YOUR JAVASCRIPT
         ========================================================= -->

    <script type="text/javascript"
            src="../../adamuat/HTMLPages/Js/script.js_1787634779764.js?v=1787641334706">
    </script>


</body>

</html>
